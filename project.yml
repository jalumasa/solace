name: Solace
options:
  bundleIdPrefix: com.jonathanalumasa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SolaceCore:
    path: SolaceCore
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Solace:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SolaceApp
        excludes:
          - "Resources/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanalumasa.Solace
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SolaceCore
        product: SolaceCore
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseFunctions
      - package: FirebaseSDK
        product: FirebaseCore
